# Publishes the landing page and the /app web app to GitHub Pages.
# Enable it once: Settings > Pages > Source: GitHub Actions. Then run it from the Actions tab
# or push to main. The site is static and makes no requests to other origins (CSP connect-src 'none').
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'src/engine/**', 'src/core/**', 'src/overlay/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Bug
description: Something in the extension, popup, options or web app does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a reply in ...
        2. Type ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        If the popup says the layout was not recognised, use its "Copy diagnostics" button and paste
        the result. It contains selector names and counts, never mail text.
      render: text
  - type: input
    id: version
    attributes:
      label: Readback version, browser and OS
      placeholder: 0.1.0, Chrome 131, Windows 11
    validations:
      required: true

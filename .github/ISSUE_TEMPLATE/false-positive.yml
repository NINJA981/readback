name: Wrong squiggle (false positive)
description: Readback flagged something in your reply that was not a slip.
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful report you can file. Please **replace real names, amounts and
        addresses** with invented ones that still reproduce the squiggle. You can check that they do
        in the web app before you paste them here.
  - type: textarea
    id: thread
    attributes:
      label: The message you were replying to
      description: The part Readback read (the latest message, with its signature). Invented details only.
      render: text
    validations:
      required: true
  - type: textarea
    id: draft
    attributes:
      label: Your reply
      render: text
    validations:
      required: true
  - type: input
    id: flagged
    attributes:
      label: What was underlined, and what the card said
      placeholder: '"Tim" underlined, card said "To: Tom"'
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - Web app (/app)
        - Extension, Gmail on the web
        - Extension, another site through "Use as Readback context"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Readback version and browser
      placeholder: 0.1.0, Chrome 131
